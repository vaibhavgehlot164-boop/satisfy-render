name: Render satisfying video
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model file name (blank = demo object)"
        required: false
        default: ""
      style:
        type: choice
        options: [drop, turntable, rain]
        default: drop
      vertical:
        type: boolean
        default: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender + ffmpeg
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Render
        env:
          MODEL: ${{ inputs.model }}
          STYLE: ${{ inputs.style }}
          VERTICAL: ${{ inputs.vertical }}
        run: |
          args=(--engine cycles --samples 32 --style "$STYLE" --out out/satisfy.mp4)
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          if [ "$VERTICAL" = "true" ]; then args+=(--vertical); fi
          blender -b -P satisfy.py -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: satisfying-video
          path: out/*.mp4
